<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eunhye Forums</title>

<style>
/* === ORIGINAL DESIGN === */
body{
    margin:0;
    background:#ba68c8;
    font-family:"Comic Sans MS", cursive;
    color:white;
    display:flex;
}

.sidebar{
    width:180px;
    height:100vh;
    background:black;
    position:fixed;
    border-right:8px dashed white;
    padding-top:20px;
    display:flex;
    flex-direction:column;
    align-items:center;
}

.nav-menu a{
    display:block;
    color:white;
    text-decoration:none;
    font-size:20px;
    padding:12px 0;
    text-align:center;
}

.nav-menu a:hover{
    background:#ff66cc;
    color:black;
}

.main-content{
    margin-left:180px;
    padding:40px;
    width:100%;
    overflow-y:auto;
    height:100vh;
}

h1{
    font-size:70px;
    text-shadow:4px 4px black;
}

/* === FORUM STYLING === */
.forum-box{
    background:#ff66cc;
    border:6px solid #00c2ff;
    padding:25px;
    max-width:700px;
    margin-bottom:50px;
}

input, textarea{
    width:100%;
    margin:10px 0;
    padding:10px;
    border:3px dashed white;
    background:#ffd6f3;
    font-family:inherit;
}

button{
    background:#00c2ff;
    border:none;
    padding:10px 20px;
    font-weight:bold;
    cursor:pointer;
    margin-top:10px;
}

button:hover{
    background:#0099cc;
}

.comment{
    background:#ffd6f3;
    color:black;
    margin-top:15px;
    padding:10px;
    border-left:6px solid #00c2ff;
}

.comment-name{
    font-weight:bold;
    color:#ff3399;
}

.status{
    margin-top:10px;
    font-size:14px;
}
</style>
</head>
<body>

<nav class="sidebar">
<div class="nav-menu">
<a href="index.html">Home</a>
<a href="gallery.html">Gallery</a>
<a href="forums.html">Eunhye Forums</a>
<a href="blog.html">Blog</a>
<a href="facts.html">Fun Facts</a>
<img src="133D5A534E4005AC01.jpeg" width="120" style="margin-top:30px;">
</div>
</nav>

<div class="main-content">

<h1>Eunhye Forums</h1>

<div class="forum-box">

<h2>Welcome!</h2>
<p>This is the Eunhye forums on my Eunhye fansite — feel free to tell me what things you want to see on this fansite.</p>

<form id="comment-form">
<input type="text" id="name" placeholder="Your name" required>
<textarea id="message" placeholder="Write a message..." required></textarea>
<button type="submit">Post Message</button>
</form>

<div class="status" id="status"></div>

<h3>Fan Messages</h3>
<div id="comments"></div>

</div>
</div>

<script>
/* ================================
   LOCAL STORAGE FORUM
================================ */

// Load messages from localStorage
function loadComments() {
    const container = document.getElementById("comments");
    container.innerHTML = "";

    let comments = JSON.parse(localStorage.getItem("eunhyeForum")) || [];
    comments.reverse().forEach(c => {
        const div = document.createElement("div");
        div.className = "comment";
        div.innerHTML = `<div class="comment-name">${c.name}</div>
                         <div>${c.message}</div>`;
        container.appendChild(div);
    });

    if (comments.length === 0) {
        container.innerHTML = "No messages yet — be the first!";
    }
}

// Handle new comment submission
document.getElementById("comment-form").addEventListener("submit", e => {
    e.preventDefault();

    const name = document.getElementById("name").value.trim() || "Anonymous";
    const message = document.getElementById("message").value.trim();
    const status = document.getElementById("status");

    if (!message) {
        status.innerText = "Please write a message.";
        return;
    }

    // Get existing comments
    let comments = JSON.parse(localStorage.getItem("eunhyeForum")) || [];

    // Add new comment
    comments.push({
        name: name,
        message: message,
        date: new Date().toISOString()
    });

    // Save back to localStorage
    localStorage.setItem("eunhyeForum", JSON.stringify(comments));

    status.innerText = "Message posted! 💗";
    document.getElementById("comment-form").reset();

    loadComments();
});

// Initial load
loadComments();
</script>

</body>
</html>
